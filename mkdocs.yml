site_name: Navio Technical Knowledge Base
site_description: Technical documentation for the Navio blockchain — protocol, node, RPC, BLSCT, SDK, explorer, and developer guides.
site_url: https://docs.nav.io/
repo_url: https://github.com/nav-io/navio-developer-docs
repo_name: nav-io/navio-developer-docs
edit_uri: edit/master/docs/

theme:
    name: material
    language: en
    logo: assets/logo.svg
    favicon: assets/favicon.svg
    font:
        text: Inter
        code: JetBrains Mono
    palette:
        - media: "(prefers-color-scheme: dark)"
          scheme: slate
          primary: custom
          accent: custom
          toggle:
              icon: material/weather-sunny
              name: Switch to light mode
        - media: "(prefers-color-scheme: light)"
          scheme: default
          primary: custom
          accent: custom
          toggle:
              icon: material/weather-night
              name: Switch to dark mode
    features:
        - navigation.tabs
        - navigation.tabs.sticky
        - navigation.sections
        - navigation.top
        - navigation.tracking
        - navigation.indexes
        - navigation.footer
        - navigation.instant
        - navigation.instant.progress
        - search.suggest
        - search.highlight
        - search.share
        - content.code.copy
        - content.code.annotate
        - content.tabs.link
        - content.tooltips
        - toc.follow
        - header.autohide
    icon:
        repo: fontawesome/brands/github
        admonition:
            note: octicons/tag-16
            abstract: octicons/checklist-16
            info: octicons/info-16
            tip: octicons/squirrel-16
            success: octicons/check-16
            question: octicons/question-16
            warning: octicons/alert-16
            failure: octicons/x-circle-16
            danger: octicons/zap-16
            bug: octicons/bug-16
            example: octicons/beaker-16
            quote: octicons/quote-16

extra_css:
    - stylesheets/extra.css

extra_javascript:
    - javascripts/mathjax.js
    - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
    - javascripts/mermaid.js
    - https://unpkg.com/mermaid@10.9.1/dist/mermaid.min.js

extra:
    version:
        provider: mike
        default: latest
    social:
        - icon: fontawesome/brands/github
          link: https://github.com/nav-io
        - icon: fontawesome/brands/discord
          link: https://discord.com/invite/eBQ2QUkVXy
        - icon: fontawesome/brands/x-twitter
          link: https://x.com/nav_io
    analytics:
        feedback:
            title: Was this page helpful?
            ratings:
                - icon: material/thumb-up-outline
                  name: Helpful
                  data: 1
                  note: Thanks for your feedback!
                - icon: material/thumb-down-outline
                  name: Not helpful
                  data: 0
                  note: Thanks — please [open an issue](https://github.com/nav-io/navio-developer-docs/issues/new) describing what's missing or wrong.

markdown_extensions:
    - abbr
    - admonition
    - attr_list
    - def_list
    - footnotes
    - md_in_html
    - tables
    - toc:
          permalink: true
          toc_depth: 4
    - pymdownx.arithmatex:
          generic: true
    - pymdownx.betterem
    - pymdownx.caret
    - pymdownx.details
    - pymdownx.emoji:
          emoji_index: !!python/name:material.extensions.emoji.twemoji
          emoji_generator: !!python/name:material.extensions.emoji.to_svg
    - pymdownx.highlight:
          anchor_linenums: true
          line_spans: __span
          pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.keys
    - pymdownx.magiclink
    - pymdownx.mark
    - pymdownx.smartsymbols
    - pymdownx.snippets
    - pymdownx.superfences:
          custom_fences:
              - name: mermaid
                class: mermaid
                format: !!python/name:pymdownx.superfences.fence_code_format
    - pymdownx.tabbed:
          alternate_style: true
    - pymdownx.tasklist:
          custom_checkbox: true
    - pymdownx.tilde

plugins:
    - search:
          separator: '[\s​\-_,:!=\[\]()"`/]+|\.(?!\d)|&[lg]t;|(?!\b)(?=[A-Z][a-z])'
    - awesome-pages

